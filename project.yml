# XcodeGen 工程描述文件
# 在 macOS 上运行: brew install xcodegen && xcodegen generate
# 生成 companion-countdown.xcodeproj
name: companion-countdown

options:
  bundleIdPrefix: com.companion.countdown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CompanionCountdown:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/CompanionCountdown.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.companion.countdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.countdown
        INFOPLIST_KEY_CFBundleDisplayName: "TA的一辈子"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CompanionCountdownWidget
        embed: true
    scheme:
      testTargets:
        - CompanionCountdownTests

  CompanionCountdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.companion.countdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.countdown.widget
        INFOPLIST_KEY_CFBundleDisplayName: "TA的一辈子"
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  CompanionCountdownTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    dependencies:
      - target: CompanionCountdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companion.countdown.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  CompanionCountdown:
    build:
      targets:
        CompanionCountdown: all
        CompanionCountdownWidget: all
    run:
      config: Debug
    archive:
      config: Release
